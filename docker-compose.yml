version: "3.9"

services:
  db:
    image: postgres:16
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Je restreins à 127.0.0.1 : sans ça, Docker publie par défaut sur
      # 0.0.0.0, donc n'importe qui sur mon réseau local (Wi-Fi partagé,
      # réseau d'entreprise) pourrait se connecter directement à PostgreSQL
      # en contournant mon API et son RBAC.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d   # exécute les .sql au premier démarrage

  # Mon gestionnaire de secrets (voir docs/securite.md) : remplace le stockage
  # en clair dans .env pour le mot de passe PostgreSQL et la clé JWT. Mode
  # "dev" UNIQUEMENT : auto-unseal, un seul nœud, token root fixe -- ça n'est
  # pas un déploiement Vault de production (qui demanderait un stockage
  # persistant, un vrai init/unseal, et une politique d'accès par rôle), mais
  # ça fait tourner un vrai serveur Vault en local, interrogé par l'API via
  # son API HTTP (voir api/secrets_provider.py), pas un simulacre.
  vault:
    image: hashicorp/vault:1.17
    container_name: ecommerce_vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      # Même raison que pour db ci-dessus : accessible uniquement en local,
      # jamais depuis le réseau. VAULT_DEV_LISTEN_ADDRESS reste à 0.0.0.0
      # (bind interne AU conteneur, nécessaire pour que Docker puisse
      # relayer le port) -- ça n'expose rien en dehors du conteneur, c'est
      # bien ce mapping "ports" qui contrôle l'exposition réelle sur ma
      # machine.
      - "127.0.0.1:8200:8200"

volumes:
  pgdata:
