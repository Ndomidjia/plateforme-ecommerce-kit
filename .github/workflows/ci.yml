name: CI

# Je réponds ici au retour de soutenance "absence de CI/CD confirmée,
# processus de déploiement flou" : ce pipeline tourne mes tests automatisés
# (tests/) à chaque push/PR, sur une base PostgreSQL fraîche (schéma seul --
# je ne commite pas mes CSV Kaggle sources, voir tests/test_data_quality.py
# et docs/deploiement.md pour ce que ça implique concrètement).
#
# Ce que ce pipeline NE fait PAS (limite que j'assume, voir
# docs/deploiement.md) : pas de déploiement automatique (CD) -- je n'ai pas
# d'environnement hébergé vers lequel déployer pour ce projet. "CI" au sens
# strict, pas "CI/CD" complet.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ecommerce_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Mon gestionnaire de secrets (voir docs/securite.md et
      # api/secrets_provider.py). Je le teste ici sur un vrai Linux (runner
      # GitHub-hosted) : en local, sur ma machine Windows, le binaire Vault
      # crashe au démarrage (bug Go runtime documenté lié à mlock/IPC_LOCK
      # sous Docker Desktop/WSL2, indépendant de ma configuration -- voir
      # docs/securite.md) ; la CI est donc ma seule preuve que l'intégration
      # fonctionne réellement de bout en bout, pas seulement son repli .env.
      vault:
        image: hashicorp/vault:1.17
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ci-dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://ecommerce_admin:ci_password@localhost:5432/ecommerce_platform
      JWT_SECRET_KEY: ci-only-secret-not-used-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ci-dev-root-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Pousser mes secrets dans Vault
        run: python scripts/vault_init.py

      - name: Appliquer le schéma SQL (sans les données -- voir docs/tests.md)
        run: |
          for f in sql/01_schemas.sql sql/02_olist_tables.sql sql/03_retailrocket_tables.sql \
                   sql/04_churn_tables.sql sql/05_analytics_tables.sql sql/06_app_tables.sql \
                   sql/07_sentiment_table.sql sql/08_churn_feature_importance.sql \
                   sql/09_customer_360.sql sql/10_model_metrics_history.sql sql/11_model_registry.sql; do
            echo "-- $f --"
            PGPASSWORD=ci_password psql -h localhost -U ecommerce_admin -d ecommerce_platform -f "$f"
          done

      - name: pytest
        working-directory: .
        run: pytest -v

      - name: Vérifier que les secrets viennent bien de Vault, pas d'un repli .env accidentel
        working-directory: api
        # Je remplace volontairement DATABASE_URL/JWT_SECRET_KEY par des
        # valeurs bidon pour ce seul process (via `env:`) : si config.py
        # résout quand même les vraies valeurs (celles poussées dans Vault),
        # c'est la preuve qu'elles viennent de Vault, pas d'un repli .env
        # qui coïnciderait par hasard.
        env:
          DATABASE_URL: "postgresql+psycopg2://wrong:wrong@nowhere/wrong"
          JWT_SECRET_KEY: "wrong-secret-should-not-be-used"
        run: >
          python -c "import config;
          assert config.DATABASE_URL == 'postgresql+psycopg2://ecommerce_admin:ci_password@localhost:5432/ecommerce_platform', 'lu depuis .env, pas Vault';
          assert config.JWT_SECRET_KEY == 'ci-only-secret-not-used-in-production', 'lu depuis .env, pas Vault';
          print('Secrets confirmes lus depuis Vault (pas depuis les variables bidon ni un repli .env).')"

      - name: Créer un compte admin de test et vérifier que l'API démarre
        working-directory: api
        run: |
          python create_admin.py ci_smoke_admin "CiSmoke!2026"
          nohup python -m uvicorn main:app --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
