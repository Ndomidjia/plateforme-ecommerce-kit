# Pile de production (serveur distant, voir docs/deploiement.md) : à la
# différence de docker-compose.yml (dev local, où l'API tourne directement
# sur l'hôte), ici l'API tourne elle aussi en conteneur, sur le même réseau
# Docker que `db` et `vault` -- je n'ai donc besoin d'exposer AUCUN port de
# `db`/`vault` sur l'hôte, pas même en 127.0.0.1 : seul `web` (Caddy) publie
# les ports 80/443, tout le reste ne communique qu'en interne au réseau
# Docker, par nom de service.
#
# Usage : docker compose -f docker-compose.prod.yml up -d --build
# (nécessite un fichier .env sur le serveur -- voir .env.example et
# docs/deploiement.md pour la liste complète des variables attendues)

services:
  db:
    image: postgres:16
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  vault:
    image: hashicorp/vault:1.17
    container_name: ecommerce_vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: ecommerce_api
    restart: unless-stopped
    depends_on:
      - db
      - vault
    env_file: .env
    environment:
      # Adresses internes au réseau Docker (par nom de service), distinctes
      # de celles utilisées en dev local où l'API tourne sur l'hôte.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
      CORS_EXTRA_ORIGIN: https://${DUCKDNS_DOMAIN}

  web:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: ecommerce_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
